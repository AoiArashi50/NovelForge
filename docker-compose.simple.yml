# NovelForge — 简化版 Docker Compose（本地 Build）
# 不包含 nginx，应用直接暴露在 http://localhost:3002
#
# ⚡ 如果你希望跳过本地 Build，直接拉取预编译镜像（30 秒启动）：
#    docker compose -f docker-compose.image.yml up -d
#
# 使用方式：
#   1. 复制 .env.example 为 .env，填写 API Key
#   2. docker compose -f docker-compose.simple.yml up -d
#   3. 打开 http://localhost:3002

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3002:3000"
    environment:
      - DATABASE_URL=postgresql://novelforge:${DB_PASSWORD}@db:5432/novelforge
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-1536}
      - NODE_ENV=production
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3002/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=novelforge
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=novelforge
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novelforge -d novelforge"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
